name = "eclipse-ytmusic"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
ADDON_VERSION = "1.3.0"
YT_PO_TOKEN_GENERATOR_URL = "https://bgutil-ytdlp-pot-provider-4pve.onrender.com/get_pot"

# ── Upstash Redis ──────────────────────────────────────────────────────────────
# Set these as Worker secrets (NOT plain vars) so they stay out of source code:
#
#   wrangler secret put UPSTASH_REDIS_REST_URL
#   wrangler secret put UPSTASH_REDIS_REST_TOKEN
#
# Get both values from: https://console.upstash.com → your Redis DB → REST API
# The worker falls back gracefully if these aren't set (no caching, still works).

# ── Optional: custom domain ────────────────────────────────────────────────────
# [[routes]]
# pattern = "ytmusic.yourdomain.com"
# zone_name = "yourdomain.com"
